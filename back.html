<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Loading...</title>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const adDomain = params.get('domain');
            const zoneId = params.get('zoneid') || params.get('z');
            const useTemplate = params.get('use_template');

            // 1. Mode Monetag Zone
            if (adDomain && zoneId) {
                const cleanDomain = adDomain.replace(/\/$/, "");
                window.location.replace(`${cleanDomain}/4/${zoneId}`);
                return;
            }

            // 2. Mode Adsterra Split / Direct URL dari sessionStorage
            if (useTemplate === "1") {
                try {
                    const tpl = sessionStorage.getItem('back_url_template');
                    if (tpl) {
                        window.location.replace(tpl);
                        return;
                    }
                } catch (e) {}
            }

            // 3. Fallback mutlak jika sessionStorage kosong/diblokir
            window.location.replace("https://s.shopee.co.id/60Ss4FzcI8");
        })();
    </script>
</head>
<body style="background-color: #000; margin: 0;">
</body>
</html>
